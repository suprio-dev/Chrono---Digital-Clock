<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Clock</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="min-h-screen overflow-hidden
           bg-[#05060d]
           flex items-center justify-center
           relative">


    <!-- ================= BACKGROUND ================= -->

    <div class="absolute inset-0 overflow-hidden">


        <!-- Purple Glow -->

        <div class="absolute
                   -top-32 -left-32
                   w-96 h-96
                   rounded-full
                   bg-violet-600/20
                   blur-[100px]
                   animate-pulse">
        </div>


        <!-- Cyan Glow -->

        <div class="absolute
                   -bottom-32 -right-32
                   w-96 h-96
                   rounded-full
                   bg-cyan-500/20
                   blur-[100px]
                   animate-pulse">
        </div>


        <!-- Pink Glow -->

        <div class="absolute
                   top-1/3 right-1/4
                   w-64 h-64
                   rounded-full
                   bg-fuchsia-500/10
                   blur-[100px]
                   animate-pulse">
        </div>


        <!-- Floating Circle 1 -->

        <div class="absolute
                   top-20 left-[15%]
                   w-4 h-4
                   rounded-full
                   bg-violet-400/40
                   shadow-[0_0_25px_rgba(167,139,250,0.6)]
                   animate-bounce">
        </div>


        <!-- Floating Circle 2 -->

        <div class="absolute
                   bottom-24 right-[18%]
                   w-3 h-3
                   rounded-full
                   bg-cyan-300/50
                   shadow-[0_0_20px_rgba(103,232,249,0.7)]
                   animate-bounce">
        </div>


        <!-- Floating Circle 3 -->

        <div class="absolute
                   top-[25%] right-[12%]
                   w-2 h-2
                   rounded-full
                   bg-fuchsia-400/50
                   animate-ping">
        </div>


        <!-- Grid -->

        <div class="absolute inset-0 opacity-[0.025]" style="
                background-image:
                linear-gradient(#ffffff 1px, transparent 1px),
                linear-gradient(90deg, #ffffff 1px, transparent 1px);
                background-size: 50px 50px;
            ">
        </div>

    </div>



    <!-- ================= MAIN ================= -->

    <main class="relative z-10
               w-full max-w-xl
               px-6">


        <!-- Small Label -->

        <div class="text-center mb-8">

            <p class="text-xs
                       uppercase
                       tracking-[0.5em]
                       text-cyan-400
                       font-semibold">
                Every second counts
            </p>

            <h1 class="text-4xl md:text-5xl
                       font-black
                       text-white
                       tracking-tight
                       mt-2">
                Chrono
            </h1>

        </div>



        <!-- ================= CLOCK CARD ================= -->

        <div class="relative
                   rounded-[36px]
                   p-6 md:p-8

                   bg-white/[0.06]
                   backdrop-blur-2xl

                   border border-white/10

                   shadow-[0_40px_100px_rgba(0,0,0,0.65)]

                   ring-1 ring-white/5">


            <!-- Top shine -->

            <div class="absolute
                       top-0 left-1/2
                       -translate-x-1/2

                       w-32 h-[2px]

                       bg-gradient-to-r
                       from-transparent
                       via-cyan-400
                       to-transparent

                       opacity-70">
            </div>



            <!-- ================= DATE ================= -->

            <div class="text-center mb-7">

                <p id="date" class="text-sm md:text-base
                           text-slate-400
                           tracking-[0.25em]
                           uppercase">

                </p>

            </div>



            <!-- ================= CLOCK DISPLAY ================= -->

            <div class="relative
                       rounded-[28px]

                       px-5 py-8 md:px-8 md:py-10

                       bg-[#03040a]/80

                       border border-white/[0.06]

                       shadow-[inset_0_0_40px_rgba(0,0,0,0.8)]">


                <!-- Glow behind numbers -->

                <div class="absolute
                           inset-0
                           bg-cyan-400/[0.025]
                           rounded-[28px]
                           pointer-events-none">
                </div>



                <!-- Time -->

                <div class="relative
                           flex
                           items-center
                           justify-center
                           gap-2 md:gap-4">


                    <!-- Hours -->

                    <div class="text-center">

                        <div id="hours" class="text-5xl
                                   sm:text-6xl
                                   md:text-7xl
                                   font-black
                                   tracking-tight

                                   bg-gradient-to-b
                                   from-white
                                   to-slate-400
                                   bg-clip-text
                                   text-transparent">
                            00
                        </div>

                        <p class="text-[9px]
                                   md:text-[10px]
                                   text-slate-600
                                   tracking-[0.3em]
                                   uppercase
                                   mt-2">
                            Hours
                        </p>

                    </div>



                    <!-- Colon -->

                    <span class="text-4xl
                               md:text-6xl
                               font-black
                               text-cyan-400
                               -mt-5
                               animate-pulse">
                        :
                    </span>



                    <!-- Minutes -->

                    <div class="text-center">

                        <div id="minutes" class="text-5xl
                                   sm:text-6xl
                                   md:text-7xl
                                   font-black
                                   tracking-tight

                                   bg-gradient-to-b
                                   from-white
                                   to-slate-400
                                   bg-clip-text
                                   text-transparent">
                            00
                        </div>

                        <p class="text-[9px]
                                   md:text-[10px]
                                   text-slate-600
                                   tracking-[0.3em]
                                   uppercase
                                   mt-2">
                            Minutes
                        </p>

                    </div>



                    <!-- Colon -->

                    <span class="text-4xl
                               md:text-6xl
                               font-black
                               text-cyan-400
                               -mt-5
                               animate-pulse">
                        :
                    </span>



                    <!-- Seconds -->

                    <div class="text-center">

                        <div id="seconds" class="text-5xl
                                   sm:text-6xl
                                   md:text-7xl
                                   font-black
                                   tracking-tight

                                   bg-gradient-to-b
                                   from-cyan-300
                                   to-cyan-600
                                   bg-clip-text
                                   text-transparent">
                            00
                        </div>

                        <p class="text-[9px]
                                   md:text-[10px]
                                   text-slate-600
                                   tracking-[0.3em]
                                   uppercase
                                   mt-2">
                            Seconds
                        </p>

                    </div>


                    <!-- AM PM -->

                    <div id="ampm" class="self-start
                               mt-3
                               ml-1

                               text-xs
                               md:text-sm

                               font-bold
                               text-cyan-400

                               tracking-widest">
                        PM
                    </div>

                </div>

            </div>



            <!-- ================= BOTTOM INFO ================= -->

            <div class="flex
                       items-center
                       justify-between
                       mt-6
                       px-2">


                <!-- Status -->

                <div class="flex
                           items-center
                           gap-2">

                    <span class="w-2 h-2
                               rounded-full
                               bg-emerald-400
                               shadow-[0_0_12px_rgba(52,211,153,0.8)]
                               animate-pulse">
                    </span>

                    <span class="text-xs
                               text-slate-500
                               tracking-wider">
                        LIVE
                    </span>

                </div>


                <!-- Digital -->

                <span class="text-xs
                           text-slate-600
                           tracking-widest
                           uppercase">
                    Time Sync
                </span>

            </div>


        </div>



        <!-- Footer -->

        <p class="text-center
                   text-slate-700
                   text-xs
                   mt-7
                   tracking-wider">
            Digital Clock
        </p>


    </main>


    <script src="index.js"></script>

</body>

</html>
